# Auslieferung einer RLS-Instanz.
#
#   /          Landingpage der Instanz   (Mount: /srv/landing)
#   /app       Reference-App             (im Image)
#   /branding  Logo, Favicon, Theme      (Mount: /srv/branding)
#
# Die Landingpage teilt weder Build noch Router mit der App (Spec 11).

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Landingpage der Instanz ---
    location / {
        root /srv/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
        # Kurz cachen: der Betreiber aendert sie oft und will das Ergebnis sehen.
        add_header Cache-Control "public, max-age=60";
    }

    # --- Branding-Assets ---
    location /branding/ {
        alias /srv/branding/;
        add_header Cache-Control "public, max-age=300";
    }

    # --- Instanz-Konfiguration ---
    # Nie cachen: sie entscheidet ueber Endpunkte und Identitaet. Eine
    # gecachte config.json wuerde eine geaenderte Instanz stumm weiterlaufen
    # lassen wie die alte.
    location = /app/config.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # --- Reference-App ---
    # Gehashte Assets sind unveraenderlich und duerfen lange liegen.
    location ~ ^/app/assets/.*\.(js|css|woff2?|png|jpg|svg|webp)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: jede Tiefe faellt auf die index.html der App zurueck, damit
    # /app/<space>/<modul>/<item> beim Neuladen nicht 404 ergibt.
    location /app {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
    }
}
