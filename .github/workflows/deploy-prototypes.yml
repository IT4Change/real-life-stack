name: Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-prototypes.yml'
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: 'OTA rollback: release tag to restore (e.g. ota-a3f9c12). Leave empty for normal deploy.'
        required: false
        type: string

# Nur der Grundstock. `pages: write` und `id-token: write` braucht allein der
# `deploy`-Job und stehen darum dort — sonst erbt sie auch `build`, der
# `pnpm install` mit Lifecycle-Skripten und die Builds fährt.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # `contents: write` nur für `gh release create` (OTA-Bundles). Das läuft
    # über `GH_TOKEN` als Env, nicht über die Git-Konfiguration — daher unten
    # `persist-credentials: false`.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (data-interface, toolkit, connectors)
        run: |
          pnpm --filter @real-life-stack/data-interface build
          pnpm --filter @real-life-stack/toolkit build
          pnpm --filter @real-life-stack/mock-connector --filter @real-life-stack/local-connector build
          pnpm --filter @real-life-stack/wot-connector build

      - name: Build landing page
        run: pnpm --filter landing build
        env:
          VITE_BASE_PATH: /

      - name: Set SHORT_SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # OTA bundles MUST be built with base path "/" — the native app
      # loads them from capacitor://localhost/ (and the embedded bundle
      # from `cap sync` is also base "/"). Building them with "/app/"
      # (the web deployment base) makes every asset 404 after an OTA
      # reload — a blank screen. The web-of-trust demo gets this right.
      - name: Build OTA bundles
        run: |
          for channel in ios android android-foss; do
            pnpm --filter reference build
            (cd apps/reference/dist && zip -r "../../../bundle-${channel}-${SHORT_SHA}.zip" .)
          done
        env:
          VITE_BASE_PATH: /
          VITE_UPDATE_SERVER_URL: https://real-life-stack.de

      # The Pages build is served at real-life-stack.de/app/, so it
      # keeps base "/app/".
      - name: Build reference app (for Pages)
        run: pnpm --filter reference build
        env:
          VITE_BASE_PATH: /app/
          VITE_UPDATE_SERVER_URL: https://real-life-stack.de
          VITE_UPDATE_CHANNEL: ios

      - name: Build prototype
        working-directory: apps/prototype
        run: pnpm tsc -b && pnpm vite build --base="/edge/"

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Compute bundle hashes
        run: |
          for channel in ios android android-foss; do
            sha256sum "bundle-${channel}-${SHORT_SHA}.zip" | cut -d' ' -f1 > "hash-${channel}.txt"
          done

      - name: Create GitHub Release with OTA bundles
        if: inputs.rollback_tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ota-${SHORT_SHA}" \
            --title "OTA ${SHORT_SHA}" \
            --notes "Automatic OTA release from commit ${SHORT_SHA}" \
            bundle-ios-${SHORT_SHA}.zip \
            bundle-android-${SHORT_SHA}.zip \
            bundle-android-foss-${SHORT_SHA}.zip

      - name: Generate latest.json (normal deploy)
        if: inputs.rollback_tag == ''
        run: |
          REPO="${{ github.repository }}"
          for channel in ios android android-foss; do
            HASH=$(cat "hash-${channel}.txt")
            mkdir -p gh-pages-ota/updates/${channel}
            printf '{"bundleId":"%s","url":"%s","sha256":"%s"}\n' \
              "${SHORT_SHA}" \
              "https://github.com/${REPO}/releases/download/ota-${SHORT_SHA}/bundle-${channel}-${SHORT_SHA}.zip" \
              "${HASH}" \
              > gh-pages-ota/updates/${channel}/latest.json
          done

      - name: Generate latest.json (rollback)
        if: inputs.rollback_tag != ''
        # inputs.rollback_tag NIE direkt in run: interpolieren — das waere
        # Script-Injection. Ueber env ist der Wert ein inertes Datum, das
        # Skript quotet ihn. Gleiche Regel wie in build-on-tag.yml.
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          REPO="${{ github.repository }}"
          TAG="$ROLLBACK_TAG"
          BUNDLE_ID="${TAG#ota-}"
          for channel in ios android android-foss; do
            mkdir -p gh-pages-ota/updates/${channel}
            # Download bundle to compute hash
            gh release download "${TAG}" -p "bundle-${channel}-${BUNDLE_ID}.zip" -D /tmp
            HASH=$(sha256sum "/tmp/bundle-${channel}-${BUNDLE_ID}.zip" | cut -d' ' -f1)
            printf '{"bundleId":"%s","url":"%s","sha256":"%s"}\n' \
              "${BUNDLE_ID}" \
              "https://github.com/${REPO}/releases/download/${TAG}/bundle-${channel}-${BUNDLE_ID}.zip" \
              "${HASH}" \
              > gh-pages-ota/updates/${channel}/latest.json
          done
          echo "Rolling back OTA to ${TAG}"

      - name: Prepare deployment
        run: |
          mkdir -p gh-pages/app gh-pages/edge gh-pages/storybook
          cp -R apps/landing/dist/. gh-pages/
          cp -R apps/reference/dist/. gh-pages/app/
          cp apps/reference/public/404.html gh-pages/404.html
          cp -R apps/prototype/dist/. gh-pages/edge/
          cp -R packages/toolkit/storybook-static/. gh-pages/storybook/
          cp -R gh-pages-ota/updates/. gh-pages/updates/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # `actions/deploy-pages` braucht genau diese beiden; der Job checkt nichts
    # aus und führt keinen Projektcode aus.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
