name: Spec Validation

on:
  pull_request:
    paths:
      - 'docs/spec/**'
      - 'packages/data-interface/**'
      - '.github/workflows/spec-validation.yml'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - master
    paths:
      - 'docs/spec/**'
      - 'packages/data-interface/**'
      - '.github/workflows/spec-validation.yml'
      - 'pnpm-lock.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install data-interface deps
        run: pnpm install --filter @real-life-stack/data-interface... --frozen-lockfile

      - name: Validate spec schemas, examples, and demo-data
        run: pnpm --filter @real-life-stack/data-interface test
