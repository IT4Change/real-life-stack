# Veroeffentlicht das Instanz-Image nach GHCR.
#
# Ohne dieses Image sind die compose-Dateien unter deploy/app/ wertlos: Sie
# ziehen bewusst nur ein fertiges Artefakt und koennen selbst nichts bauen
# (Spec 11 — eine Instanz besteht aus Konfiguration und Assets).
#
# Tags:
#   1, 1.4, 1.4.2   aus einem Release-Tag v1.4.2 — Instanzen folgen "1" und
#                   bekommen Korrekturen, aber keinen Umbau
#   edge            jeder Push auf master, fuer uns zum Testen
#
# Instanzen sollten NICHT auf "edge" zeigen.

name: Publish app image

on:
  push:
    branches: [master]
    paths:
      - "apps/reference/**"
      - "packages/**"
      - "deploy/app/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/publish-app-image.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rls-app

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=raw,value=edge,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ein Image, das startet und ausliefert, ist die Mindestzusage an
      # Instanzen — geprueft am gerade gebauten Artefakt, nicht am Dockerfile.
      - name: Smoke-Test des veroeffentlichten Images
        run: |
          set -euo pipefail
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name rls-smoke -p 8080:8080 \
            -e RLS_APP_NAME="Smoke Test" \
            -e RLS_RELAY_URL="wss://relay.web-of-trust.de" \
            "$TAG"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/app/index.html >/dev/null 2>&1; then break; fi
            [ "$i" = 30 ] && { docker logs rls-smoke; exit 1; }
            sleep 1
          done
          echo "App wird ausgeliefert."
          curl -fsS http://127.0.0.1:8080/ | grep -q "<html" && echo "Landingpage wird ausgeliefert."
          CFG=$(curl -fsS http://127.0.0.1:8080/app/config.json)
          echo "$CFG" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["branding"]["appName"]=="Smoke Test", d; print("config.json korrekt erzeugt.")'
          docker rm -f rls-smoke
