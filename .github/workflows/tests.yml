# Workspace-Tests auf jedem PR. Bewusst OHNE `paths`-Filter: bis hierher lief
# in CI nur `spec-validation` (nur `data-interface`, nur bei Änderungen an
# `docs/spec/**` oder `packages/data-interface/**`) — die Suiten von toolkit,
# wot-connector, local-connector, mock-connector, reference und network liefen
# ausschliesslich lokal. Siehe Issue #185.
#
# `turbo` erledigt Reihenfolge und Abhängigkeiten: `test` und `typecheck` haben
# `dependsOn: ["^build"]`, die Workspace-Dependencies werden also automatisch
# gebaut. Ein separater Build-Schritt wäre doppelte Arbeit.
name: Tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Regressionstest fuer die Package→App-Releasekaskade (#202). Eigener Job, weil
  # er weder Install noch Zeitzonen-Matrix braucht — er liest nur die
  # release-please-Config und die Manifeste. Faengt genau die zwei Fehler, die in
  # PR #199 passiert und in der CI unsichtbar waren: App als "simple" (faellt aus
  # dem node-workspace-Graphen) und ein root-relativer extra-files-Pfad (bumpt die
  # Versionsdatei nie). Ohne diesen Vertrag erreicht ein Paket-Fix Play nie, weil
  # Play bewusst kein OTA hat.
  release-cascade:
    runs-on: ubuntu-latest
    # Minimalrecht: der Job liest nur Dateien aus dem Checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kaskaden-Vertrag pruefen
        run: node scripts/release/test-release-cascade.mjs

      # Der Waechter muss auch beweisen, dass er BEISST: der Selbsttest laesst ihn
      # gegen praeparierte Fixtures laufen und verlangt, dass jede Verletzung rot
      # wird. Ohne das koennte er wieder still fail-open werden.
      - name: Waechter-Selbsttest (Negativfaelle)
        run: node scripts/release/test-release-cascade.selftest.mjs

      # Die Schutzwaelle des npm-Bootstraps (Argumentpruefung, Tarball-Identitaet,
      # Registry-Bindung) gegen Regression sichern. Laeuft OFFLINE — npm und pnpm
      # sind gestubbt, es wird nichts publiziert und kein Konto gebraucht.
      - name: npm-Bootstrap-Grenzen pruefen
        run: scripts/release/bootstrap-npm-publish.test.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      # Nicht abbrechen, wenn eine Zone fällt — sonst sieht man nur die erste
      # und weiss nicht, ob es ein Zeitzonen- oder ein echter Fehler ist.
      fail-fast: false
      matrix:
        # Die zweite Achse ist kein Selbstzweck: Kalender-Buckets sind LOKALE
        # Tage, und Fixtures mit UTC-Datum oder festem Offset kippen westlich
        # von Greenwich auf den Vortag (CodeRabbit-Finding in #183). UTC allein
        # hätte das nie gezeigt.
        #
        # `TZ` steht darum auch in `turbo.json` unter `test.env`: sonst ist es
        # nicht Teil des Cache-Keys und ein UTC-Ergebnis würde für Los Angeles
        # wiederverwendet — die Achse wäre still wirkungslos. Auf getrennten
        # Runnern fällt das heute nicht auf, mit Remote-Caching sofort.
        tz: [UTC, America/Los_Angeles]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      # `persist-credentials: false`: direkt danach laufen `pnpm install`
      # (Lifecycle-Skripte) und `pnpm test` — also Code aus dem PR. Der
      # GITHUB_TOKEN hat hier zwar nur `contents: read`, muss diesen Prozessen
      # aber gar nicht erst über die lokale Git-Konfiguration erreichbar sein.
      # Der Job pusht nichts, braucht die Credentials also nirgends.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # KEIN version:-Input — packageManager in der package.json entscheidet.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm --filter @real-life-stack/toolkit typecheck
